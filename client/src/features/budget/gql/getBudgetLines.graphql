query getBudgetLines(
  $editionId: Float!
  $budgetLineType: LineTypeEnum!
  $excludeHelloAsso: Boolean
) {
  budgetLines(
    editionId: $editionId
    budgetLineType: $budgetLineType
    excludeHelloAsso: $excludeHelloAsso
  ) {
    id
    name
    description
    estimatedQuantity
    estimatedUnitPrice
    realCost
    salesCount
    lineType
    category {
      id
      name
      color
    }
    helloAssoProductId
  }
}
