query getOrderOrigin($id: Float!, $editionId: Float!) {
  orderOrigin(id: $id) {
    id
    name
    isPhysical
    budgetLines(editionId: $editionId) {
      id
      name
      estimatedUnitPrice
      isFreePrice
      category {
        id
        name
        color
        isUsed
      }
    }
  }
}
