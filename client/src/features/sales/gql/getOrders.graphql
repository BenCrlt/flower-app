query getOrders($editionId: Float!, $from: String, $to: String) {
  orders(editionId: $editionId, from: $from, to: $to) {
    id
    totalAmount
    executedAt
    payerFirstName
    payerLastName
    payerEmail
    helloAssoOrderId
    authorId
    author {
      id
      username
    }
    sales {
      id
      budgetLineId
      quantity
      executedAt
      budgetLine {
        id
        name
        category {
          id
          name
          color
        }
      }
    }
  }
}
