input AddInvoicePaymentsInput {
  budgetLineId: Float!
  quantity: Float!
  unitPrice: Float!
}

type BudgetCategoriesItem {
  color: String!
  id: Int!
  name: String!
}

type BudgetLinesItem {
  budgetCategoryId: Int!
  category: BudgetCategoriesItem
  description: String
  editionId: Int!
  estimatedQuantity: Float!
  estimatedUnitPrice: String!
  helloAssoProductId: Int
  id: Int!
  lineType: LineType!
  name: String!
  realCost: Int
  salesCount: Int
}

type EditionsItem {
  active: Boolean!
  endDate: String!
  id: Int!
  name: String!
  startDate: String!
  totalExpense: Float!
  totalIncome: Float!
  totalPrevisionnalExpense: Float!
  totalPrevisionnalIncome: Float!
}

type GetBudgetStatsByCategories {
  categoryName: String!
  total: Float!
  totalEstimated: Float!
}

type HelloAssoConfigItem {
  editionId: Int!
  formSlug: String!
  id: Int!
}

enum InvoiceStatus {
  CANCELLED
  PAID
  PENDING
}

type InvoicesItem {
  author: UserItem
  authorId: String!
  editionId: Int!
  executedAt: String
  id: Int!
  name: String!
  note: String
  payments: [PaymentsItem!]!
  status: InvoicesStatusEnum!
  totalAmount: String!
  vendor: VendorsItem
  vendorId: Int!
}

enum InvoicesStatusEnum {
  CANCELLED
  PAID
  PENDING
}

enum LineType {
  EXPENSE
  INCOME
}

enum LineTypeEnum {
  expense
  income
}

type Mutation {
  addBudgetCategory(color: String!, name: String!): BudgetCategoriesItem
  addBudgetLine(budgetCategoryId: Float!, description: String, editionId: Float!, estimatedQuantity: Int!, estimatedUnitPrice: Float!, lineType: LineTypeEnum!, name: String!): BudgetLinesItem
  addEdition(active: Boolean, endDate: String!, name: String!, startDate: String!): EditionsItem
  addHelloAssoConfig(budgetCategoryId: Float, editionId: Float!, enableSynchro: Boolean, formSlug: String!): HelloAssoConfigItem
  addInvoice(authorId: String!, editionId: Float!, name: String!, note: String, payments: [AddInvoicePaymentsInput!]!, status: InvoiceStatus!, totalAmount: Float!, vendorId: Float!): InvoicesItem
  addOrUpdateOrderOrigin(id: Float, name: String!): OrderOriginsItem
  addOrUpdateVendor(address: String, description: String, email: String, id: Float, name: String!, phone: String): VendorsItem
  deleteBudgetCategory(id: Float!): BudgetCategoriesItem
  deleteBudgetLine(id: Float!): BudgetLinesItem
  deleteEdition(id: Float!): EditionsItem
  deleteInvoice(id: Float!): InvoicesItem
  deleteOrderOrigin(id: Float!): OrderOriginsItem
  deleteVendor(id: Float!): VendorsItem
  synchroSales(from: String!, helloAssoConfigId: Float!, to: String!): [SalesItem!]!
  updateBudgetCategory(id: Float!, name: String!): BudgetCategoriesItem
  updateBudgetLine(budgetCategoryId: Float, description: String, editionId: Float, estimatedQuantity: Int, estimatedUnitPrice: Float, helloAssoProductId: Float, id: Float!, lineType: LineTypeEnum, name: String): BudgetLinesItem
  updateEdition(endDate: String, id: Float!, name: String, startDate: String): EditionsItem
  updateHelloAssoConfig(formSlug: String!, id: Float!): HelloAssoConfigItem
  updateInvoice(authorId: String, editionId: Float!, id: Float!, name: String, note: String, payments: [UpdateInvoicePaymentsInput!], status: InvoiceStatus, totalAmount: Float, vendorId: Float): InvoicesItem
  validateOrder(editionId: Float!, originId: Float!, paymentMethod: ValidateOrderPaymentMethodInput!, sales: [ValidateOrderSalesInput!]!): OrdersItem
}

type OrderOriginsItem {
  id: Int!
  isPhysical: Boolean!
  name: String!
}

type OrdersItem {
  author: UserItem
  authorId: String
  editionId: Int!
  executedAt: String!
  helloAssoOrderId: Int
  id: Int!
  origin: OrderOriginsItem
  originId: Int!
  payerEmail: String
  payerFirstName: String
  payerLastName: String
  paymentMethod: String!
  sales: [SalesItem!]!
  totalAmount: Float!
}

type PaymentsItem {
  budgetLineId: Int!
  editionId: Int!
  id: Int!
  invoiceId: Int!
  quantity: Float!
  unitPrice: String!
}

type Query {
  budgetCategories: [BudgetCategoriesItem!]!
  budgetLines(budgetLineType: LineTypeEnum, editionId: Float!, excludeHelloAsso: Boolean): [BudgetLinesItem!]!
  edition(id: Float!): EditionsItem
  editions: [EditionsItem!]!
  getBudgetStatsByCategories(editionId: Float!, lineType: LineTypeEnum!): [GetBudgetStatsByCategories!]!
  helloAssoConfig(editionId: Float!): HelloAssoConfigItem
  invoices(editionId: Float!, status: InvoiceStatus): [InvoicesItem!]!
  orderOrigin(id: Float!): OrderOriginsItem
  orderOrigins(onlyPhysical: Boolean): [OrderOriginsItem!]!
  orders(editionId: Float!, from: String, originIds: [Float!], to: String): [OrdersItem!]!
  sumUpConfig: SumUpConfig!
  vendors: [VendorsItem!]!
}

type SalesItem {
  budgetLine: BudgetLinesItem
  budgetLineId: Int!
  executedAt: String!
  helloAssoSaleItemId: Int
  id: Int!
  orderId: Int!
  quantity: Float!
}

type SumUpConfig {
  affiliateKey: String!
  appId: String!
}

input UpdateInvoicePaymentsInput {
  budgetLineId: Float!
  id: Float
  quantity: Float!
  unitPrice: Float!
}

type UserItem {
  banExpires: String
  banReason: String
  banned: Boolean
  createdAt: String!
  displayUsername: String
  email: String!
  emailVerified: Boolean!
  id: String!
  image: String
  name: String!
  role: String
  updatedAt: String!
  username: String
}

enum ValidateOrderPaymentMethodInput {
  card
  cash
}

input ValidateOrderSalesInput {
  budgetLineId: Float!
  quantity: Float!
}

type VendorsItem {
  address: String
  description: String
  email: String
  id: Int!
  name: String!
  phoneNumber: String
}